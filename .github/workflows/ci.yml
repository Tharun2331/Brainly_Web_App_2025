name: CI

on:
  workflow_call:
    secrets:
      VITE_BACKEND_URL:
        required: false
        description: Backend API URL injected into the Vite build

permissions:
  contents: read


jobs:
  backend-ci:
    name: Backend — Type Check & Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: secondBrain
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@d7a11313b581b306c961b506cfc8971208bb03f6 #v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: secondBrain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend-ci:
    name: Frontend — Lint & Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: secondBrainFrontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@d7a11313b581b306c961b506cfc8971208bb03f6 #v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: secondBrainFrontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Placeholder keeps the build from failing in CI; real URL is injected on deploy
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'http://localhost:3000' }}
